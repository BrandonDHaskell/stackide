name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/brandondhaskell/stackide-toolchain:latest
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - id: img
      - run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/stackide-toolchain" >> "$GITHUB_OUTPUT"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
